on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: ['22.5.0', '22']
    env:
      NODE_OPTIONS: --experimental-sqlite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run generate
      - run: npm run typecheck
      - run: npx vitest run --coverage
      - if: matrix.os == 'ubuntu-latest' && matrix.node-version == '22'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=moderate

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: beefchicken-mcp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run container
        run: |
          docker run -d --name smoke -p 3000:3000 \
            -e HOST=0.0.0.0 -e ALLOWED_HOSTS=localhost \
            -e API_BASE_URL=https://api.example.com \
            beefchicken-mcp:ci
      - run: node scripts/e2e-docker-smoke.mjs
        env:
          E2E_BASE_URL: http://localhost:3000
      - if: always()
        run: docker logs smoke
      - if: always()
        run: docker rm -f smoke

  workers-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start wrangler dev (OAuth configured)
        run: |
          KEY=$(node -e "console.log(require('crypto').randomBytes(32).toString('base64'))")
          npx wrangler dev --port 8787 \
            --var API_BASE_URL:https://api.example.com \
            --var PUBLIC_URL:https://mcp.example.com \
            --var OAUTH_ALLOWED_REDIRECT_URIS:https://client.example/callback \
            --var OAUTH_ENCRYPTION_KEY:"$KEY" &
      - run: node scripts/e2e-workers-smoke.mjs
      - name: Start wrangler dev (no OAuth / raw bearer passthrough)
        run: |
          npx wrangler dev --port 8788 \
            --var API_BASE_URL:https://api.example.com \
            --var PUBLIC_URL: \
            --var OAUTH_ALLOWED_REDIRECT_URIS: \
            --var OAUTH_ENCRYPTION_KEY: &
      - run: E2E_BASE_URL=http://127.0.0.1:8788 node scripts/e2e-workers-basic-auth.mjs
